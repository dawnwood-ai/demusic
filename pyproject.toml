[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "demusic"
version = "0.1.0"
description = "Remove the background music AI video models (Seedance, Kling, Veo, Hailuo, Wan) bake into generated clips - keep dialogue, sound effects and ambience. Stem separation + an AudioSet music classifier, only strips where music is heard. CLI + MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dawnwood" }]
keywords = [
    "remove background music", "remove music from video", "background music remover",
    "AI video", "Seedance", "Kling", "Veo", "Hailuo", "Wan", "AI drama", "short drama",
    "vocal separation", "stem separation", "demucs", "music detection", "AudioSet", "AST",
    "dialogue", "sound effects", "ffmpeg", "MCP", "model context protocol", "AI agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.23", "onnxruntime>=1.16", "mcp>=1.10"]

[project.optional-dependencies]
demucs = ["demucs>=4.0", "torchaudio"]
fal = ["fal-client>=0.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://dawnwood.ai/open-source/"
Repository = "https://github.com/dawnwood-ai/demusic"
Issues = "https://github.com/dawnwood-ai/demusic/issues"

[project.scripts]
demusic = "demusic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/demusic"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", ".pytest_cache", "/out", "/smoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
